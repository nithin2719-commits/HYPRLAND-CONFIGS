# Environment
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = GTK_THEME,catppuccin-mocha-mauve-standard+default
env = MOZ_USE_XINPUT2,1

# Autostart
exec-once = ~/.config/hypr/scripts/waybar-watchdog.sh
exec-once = sleep 3 && awww-daemon && awww img /home/nithin/.config/hyde/themes/Crimson\ Blade/wallpapers/void.png


# Decoration
decoration {
    rounding = 15
    active_opacity = 0.95
    inactive_opacity = 0.85
    shadow {
        enabled = true
        range = 30
        render_power = 4
        color = rgba(0,0,0,0.6)
    }
    blur {
        enabled = true
        size = 8
        passes = 3
    }
}

# General
general {
    # Roomier tiles: less screen spent on gaps and borders, more on the window.
    gaps_in = 2
    gaps_out = 4
    border_size = 3   # 2px was too thin to read a moving highlight on
    # Monochrome, matched to the bar and the notification cards.
    #
    # The focused window is the ONLY bright edge on the screen: a bone-to-grey
    # gradient at 45°, so which window has focus is answered by brightness
    # rather than by hue. Everything unfocused sinks to the same graphite as the
    # bar's hairline, which is what makes the desktop read as one surface.
    #
    # userprefs.conf is sourced LAST, so these win over both HyDE's theme.conf
    # and its wallbash colors.conf -- a wallpaper change can no longer put
    # colour back on your windows.
    # Five stops, bright-dark-bright: with the borderangle loop below, rotating
    # this gradient sweeps a highlight around the window edge — the same "alive"
    # quality the RGB loop had, in monochrome, and done by the compositor's own
    # animation system instead of 33 hyprctl calls a second.
    col.active_border = rgba(ffffffff) rgba(9b9ba4dd) rgba(4a4a52cc) rgba(9b9ba4dd) rgba(ffffffff) 45deg
    col.inactive_border = rgba(3a3a42aa) rgba(2a2a30aa) 45deg
}

# Misc
misc {
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
}

# Keybinds
bind = SUPER, D, togglespecialworkspace, magic
bind = SUPER, M, movetoworkspacesilent, special:magic






bind = , F4, exec, aura-cycle.sh
exec-once = sleep 5 && openrgb --device 0 --mode "Rainbow Wave"
exec-once = sleep 5 && fusuma -d
exec-once = dunst
exec-once = /home/nithin/.config/hypr/scripts/gpu-auto.sh
