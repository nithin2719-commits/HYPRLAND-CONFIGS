# Window Rules

# The BlackArch tool view (kitty spawned by the launcher with
# --class blackarch-toolview) must fill the workspace: it prints the tool's
# description, synopsis and whole flag list before handing over the shell, and
# a small tile wraps every one of those lines.
#
# `maximize`, NOT `fullscreen`: fullscreen covers the whole output including
# waybar, which is not wanted -- the bar should stay visible. maximize fills the
# usable area instead, respecting the space waybar reserves.
#
# kitty's own --start-as maximized is not enough here: under Hyprland's tiling
# layout it just becomes another tile, so with a few windows already open the
# tool view came up a few hundred pixels wide. The compositor has to do it.
#
# Rule grammar is Hyprland >= 0.55: `<rule> <value>, match:<field> <value>`.
windowrule = maximize true, match:class blackarch-toolview

# Notifications (dunst draws on a layer surface named `notifications`).
#
# dunst itself has NO animation support -- it paints a static surface -- so the
# slide-in has to come from the compositor. `slide right` enters from the right
# edge, which is where the cards live (dunst origin = top-right).
#
# Blur is what stops the card reading as a flat rectangle pasted on the screen:
# the dunstrc backgrounds are ~85% opaque so the desktop shows through frosted.
# ignore_alpha 0.35 keeps the blur off the fully-transparent area outside the
# rounded corners -- without it every card wears a faint square halo.
#
# Field names are Hyprland 0.56 grammar and are fussier than the wiki's older
# examples: `blur true` (not bare `blur`), `ignore_alpha` (not `ignorealpha`),
# and `ignorezero` no longer exists at all.
layerrule = animation slide right, match:namespace notifications
layerrule = blur true, match:namespace notifications
layerrule = ignore_alpha 0.35, match:namespace notifications

# The bar is transparent; the chips are what you see. Blur is what makes those
# chips read as glass rather than as flat grey rectangles -- same treatment as
# the notification cards, which is the point: one surface language.
layerrule = blur true, match:namespace waybar
layerrule = ignore_alpha 0.35, match:namespace waybar
layerrule = blur true, match:namespace rofi
layerrule = ignore_alpha 0.35, match:namespace rofi

# eww dashboard (calendar + todo + music). eww 0.6 keeps the default
# gtk-layer-shell namespace, so this rule is what makes the slab read as glass.
layerrule = blur true, match:namespace gtk-layer-shell
layerrule = ignore_alpha 0.2, match:namespace gtk-layer-shell
layerrule = animation popin 90%, match:namespace gtk-layer-shell

# The calendar is a dropdown from the clock, not a window you manage: float it,
# size it, and park it under the bar on the right where the clock chip lives.
# It closes itself on focus loss (see graphite-calendar.py).
windowrule = float true, match:class dev.graphite.calendar
# 480 tall, not 400: the content needs ~514 and Hyprland was shoving the
# window up off the top of the screen (y = -5) to fit what it asked for.
windowrule = size 420 470, match:class dev.graphite.calendar
# 420 wide on a 1536-logical screen: (1536 - 420) / 2 = 558, y just under
# the 38px bar + 6px margin.
windowrule = move 558 68, match:class dev.graphite.calendar
