# BlackArch tool terminal — kitty overrides
#
# A deliberate single-theme surface (this window is always the "tool bench",
# so it commits to the red-on-black look rather than following light/dark).
# Near-black warmed toward the accent; reds span structure -> emphasis so
# banners, flags and prompts read as a hierarchy, not one flat red.

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
font_size        11.5
adjust_line_height 108%

font_family JetBrainsMono Nerd Font
font_size 11
window_padding_width 15
