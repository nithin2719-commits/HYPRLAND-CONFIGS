# BlackArch tool terminal — kitty overrides
#
# A deliberate single-theme surface (this window is always the "tool bench",
# so it commits to the red-on-black look rather than following light/dark).
# Near-black warmed toward the accent; reds span structure -> emphasis so
# banners, flags and prompts read as a hierarchy, not one flat red.

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
font_size        11.5
adjust_line_height 108%

# --- surface -------------------------------------------------------------
background            #0a0607
foreground            #f0e6e6
cursor                #ff2b2b
cursor_text_color     #0a0607
selection_background   #3a0f12
selection_foreground   #ffd9d9
background_opacity     0.94
background_blur        24

# Red "digital rain" texture behind the text. Static (no animation = no lag).
# background_tint 0.86 keeps it slightly visible without hurting legibility;
# 'cscaled' fills the window while preserving the texture's aspect.
background_image          /home/nithin/.config/blackarch-launcher/assets/matrix.png
background_image_layout   cscaled
background_image_linear   yes
background_tint           0.86
background_tint_gaps      0.86

# --- palette (warm-red ramp) --------------------------------------------
color0  #160a0b
color8  #5a4848
color1  #ff2b2b
color9  #ff5a5a
color2  #ff7a45
color10 #ff9a6a
color3  #e0a000
color11 #ffc94d
color4  #b03a3a
color12 #d06a6a
color5  #ff2b5a
color13 #ff5a86
color6  #d06a4a
color14 #e89070
color7  #9a7d7d
color15 #f0e6e6

# --- chrome --------------------------------------------------------------
window_padding_width   14
placement_strategy     center
hide_window_decorations yes
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    slanted
active_tab_foreground  #0a0607
active_tab_background  #ff2b2b
active_tab_font_style  bold
inactive_tab_foreground #9a7d7d
inactive_tab_background  #160a0b

# faster feedback for an interactive bench
repaint_delay          8
input_delay            2
sync_to_monitor        yes
enable_audio_bell      no
